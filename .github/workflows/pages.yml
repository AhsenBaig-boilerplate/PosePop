name: Build and deploy

# The browser tests (e2e) gate pull requests. The ruleset on main requires them to pass on a branch that is up to
# date with main, so the code that merges is the code that was tested: pushes to main then build and deploy without
# running them again. A release is a signed v* tag on main followed by a manual run on main, which deploys main with
# the new tag in /v/<version>/; it skips the browser tests unless asked (e2e: true). Tag pushes don't trigger a deploy:
# GitHub Pages accepts a deployment from a tag ref but keeps serving the last one from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the browser tests before deploying
        type: boolean
        default: false

# Least privilege by default; the deploy job asks for exactly what it needs.
permissions:
  contents: read

# Pull requests: one run per branch, a new push cancels the old run. Deploys (main pushes, manual runs): one queue,
# never cancelled mid-run; a newer waiting run replaces an older waiting one, which is safe because each builds main
# with every tag, so the last run to deploy always carries every release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # release tags (v*) are rebuilt into dist/v/<version>/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and verify (hashed assets, SRI, CSP)
        run: npm test
      - name: Publish releases (every v* tag into dist/v/<version>/, plus releases.json)
        run: node scripts/releases.mjs
      - name: Verify releases
        run: node scripts/verify.mjs
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  e2e:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Build and unit tests
        run: npm test
      - name: Install Chromium for Playwright (CI only; the site never loads anything from outside)
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (detection, editing, saving, updates, offline)
        run: npm run test:e2e
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    # build must pass; e2e must pass when it ran (a manual run with e2e: true) and may be skipped only on main pushes
    # and manual runs, never on a pull request. Any other result (failed, cancelled) stops the deploy.
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && !inputs.e2e))
    needs: [build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy # one deploy at a time, in order
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
